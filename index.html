<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Socket — Boutique</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div class="preloader" id="preloader" role="status" aria-label="Chargement de Socket">
        <div class="preloader-mark" aria-hidden="true">
            <span class="preloader-orbit"></span>
            <span class="preloader-logo">S</span>
        </div>
        <div class="preloader-copy">
            <strong>SOCKET</strong>
            <span>Préparation de votre espace</span>
        </div>
        <div class="preloader-progress"><span></span></div>
    </div>

    <!-- HEADER -->
    <header class="topbar">
        <div class="brand">
            <div class="brand-icon">S</div>
            <div class="brand-text">
                <div class="brand-name">Soc<span>ket</span></div>
                <div class="brand-stock" id="availableCards">0 cartes disponibles</div>
            </div>
        </div>
        <button class="header-balance" id="headerBalanceBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M16 12h.01M3 10h18"/></svg>
            <b id="walletHeader">0.00€</b>
        </button>
    </header>

    <!-- CONTENU DYNAMIQUE -->
    <main class="content" id="app-content">
        <!-- Les vues seront injectées ici par le routeur -->
    </main>

    <!-- TOAST -->
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <!-- NAVIGATION -->
    <nav class="bottom-nav" id="app-nav">
        <!-- Les boutons seront injectés par le routeur -->
    </nav>

    <!-- POINT D'ENTREE JS -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
